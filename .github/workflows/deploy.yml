name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *' # daily rebuild so expired Verified listings drop to Basic
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      # INCLUDE_DEMO is a repo variable: set it to 1 only while the site has no real listings.
      - run: npm run build
        env: { INCLUDE_DEMO: '${{ vars.INCLUDE_DEMO }}' }
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
