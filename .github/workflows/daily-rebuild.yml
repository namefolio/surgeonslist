name: Daily rebuild
# Workers Builds deploys on every push to main. This triggers one extra build a day so
# expired Verified listings drop to Basic. Secret DEPLOY_HOOK_URL = a Workers Builds deploy hook.
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "$HOOK" ]; then echo "DEPLOY_HOOK_URL secret not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
